<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bask-shot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f2f4f7; --surface:#ffffff; --surface2:#e9edf3; --text:#111111; --muted:#4a5060; --border:#d2d7e0;
  --shadow:0 6px 18px rgba(17,17,17,.10);
  --y:#ffcf06; --g:#00bf63; --b:#449cac; --r:#d20e16;
  --display:'Alfa Slab One',Georgia,'Times New Roman',serif;
  --body:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c0c0f; --surface:#17171c; --surface2:#22222a; --text:#f4f4f6; --muted:#a9adba; --border:#33333d;
    --shadow:0 6px 18px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0c0c0f; --surface:#17171c; --surface2:#22222a; --text:#f4f4f6; --muted:#a9adba; --border:#33333d;
  --shadow:0 6px 18px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.4;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--b);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:14px 14px 44px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.01em}
h2{font-size:22px;margin-bottom:10px}
.stack{display:flex;flex-direction:column;gap:14px}
.stack.sm{gap:8px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.sub{margin:0;color:var(--muted);font-size:14px}

/* Cartes */
.cimg{display:block;height:auto;filter:drop-shadow(0 4px 7px rgba(0,0,0,.35))}
.flip{animation:flip .5s cubic-bezier(.2,.9,.3,1.15)}
@keyframes flip{from{transform:rotateY(90deg) scale(.88);opacity:.2}to{transform:rotateY(0) scale(1);opacity:1}}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* Boutons */
.btn{width:100%;padding:16px;border-radius:16px;font-weight:700;font-size:18px;color:#fff;background:var(--r);box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.dark{background:#111;color:#fff}
:root[data-theme="dark"] .btn.dark{background:#f4f4f6;color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.dark{background:#f4f4f6;color:#111}}
.ghost{width:100%;padding:12px;border-radius:14px;border:2px solid var(--border);background:var(--surface);font-weight:600}
.mini{padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:14px;font-weight:500}

/* Accueil */
.hero{text-align:center;padding:8px 0 10px}
.hero h1{font-size:64px;line-height:1}
.hero p{margin:6px 0 0;color:var(--muted);font-size:18px}
.fan{display:flex;justify-content:center;align-items:center;margin:8px 0 12px;height:150px}
.fan .cimg{width:96px}
.fan .f1{transform:rotate(-14deg)}
.fan .f2{margin-left:-46px;transform:translateY(-8px) rotate(-2deg)}
.fan .f3{margin-left:-46px;transform:rotate(10deg)}
.strip{display:flex;height:12px;border-radius:99px;overflow:hidden;margin-bottom:16px}
.strip i{flex:1}
.prow{display:flex;gap:8px}
.field{flex:1;min-width:0;padding:12px 14px;border-radius:14px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font:inherit;font-weight:600;font-size:17px}
.x{width:46px;border-radius:14px;background:var(--surface2);border:1px solid var(--border);font-size:22px;line-height:1}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:2px solid var(--border);background:var(--surface2);margin-bottom:8px}
.opt:last-child{margin-bottom:0}
.opt b{display:block;font-size:17px}
.opt span{color:var(--muted);font-size:14px}
.opt.on{border-color:var(--text);background:var(--surface)}
.chips{display:flex;gap:8px}
.chip{flex:1;padding:10px 6px;border-radius:14px;border:2px solid var(--border);background:var(--surface2);text-align:center;font-weight:600;font-size:15px;line-height:1.2}
.chip.on{border-color:var(--text);background:var(--surface)}
details.rules{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:12px 14px}
details.rules summary{font-weight:600;cursor:pointer}
details.rules ul{padding-left:20px;margin:10px 0 0}
details.rules li{margin-bottom:6px}
.foot{text-align:center;color:var(--muted);font-size:13px;margin:4px 0 0}

/* Jeu */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.top h3{font-size:22px}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px;margin-bottom:14px}
.pl{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px 8px 10px;text-align:center;min-width:0}
.pl .pn{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .pv{font-family:var(--display);font-size:30px;line-height:1.1}
.pl .pu{font-size:12px;color:var(--muted)}
.dots{display:flex;justify-content:center;gap:3px;margin-top:6px}
.dots b{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;font-size:13px;font-weight:700;color:#111}
.dots b.r{background:var(--r);color:#fff}
.dots b.b{background:var(--b)}
.dots b.g{background:var(--g)}
.dots b.y{background:var(--y)}
.dots b.z{opacity:.35}
.dots b.full{outline:2px solid var(--text);outline-offset:1px}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.pile{position:relative;display:flex;justify-content:center}
.pile .cimg{width:min(52vw,210px)}
.badge{position:absolute;right:-6px;top:-8px;background:var(--text);color:var(--bg);border-radius:99px;padding:4px 12px;font-weight:700;font-size:15px}
.bigcard{width:min(58vw,240px)}
.plate{width:100%;border-radius:16px;padding:12px 16px;text-align:center}
.plate .t{font-family:var(--display);font-size:26px;line-height:1.1}
.plate .d{font-size:18px;margin-top:2px}
.plate.rouge{background:var(--r);color:#fff}
.plate.bleu{background:var(--b);color:#111}
.plate.vert{background:var(--g);color:#111}
.plate.jaune{background:var(--y);color:#111}
.ask{font-weight:700;font-size:20px;text-align:center}
.who{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.who button{padding:16px 8px;border-radius:16px;background:var(--surface);border:2px solid var(--text);font-weight:700;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who button:active{background:var(--y);color:#111}
.give{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:14px;padding:8px 10px}
.give .nm{flex:1;font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.give button{width:44px;height:44px;border-radius:12px;background:var(--surface);border:2px solid var(--text);font-size:24px;font-weight:700;line-height:1}
.give .n{width:34px;text-align:center;font-family:var(--display);font-size:24px}
.recap{font-size:15px;color:var(--muted);text-align:center;min-height:22px}
.setbox{width:100%;border-radius:18px;padding:18px;text-align:center;background:var(--y);color:#111}
.setbox h2{font-size:30px;margin-bottom:6px}
.setbox p{margin:0;font-size:20px;font-weight:600}
.rank{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface2)}
.rank.win{background:var(--y);color:#111}
.rank .rk{width:34px;height:34px;flex-shrink:0;border-radius:50%;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:18px}
.rank .info{flex:1;min-width:0}
.rank .info b{display:block;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .info span{font-size:14px}
.rank.win .info span{color:#222}
.rank .sc{font-family:var(--display);font-size:28px}
.cf{position:fixed;top:-20px;width:12px;height:12px;border-radius:3px;animation:fall 3s linear forwards;z-index:50;pointer-events:none}
@keyframes fall{to{transform:translateY(115vh) rotate(500deg)}}
@media (prefers-reduced-motion: reduce){.flip,.bob,.cf{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var IMG={
  "dos": "images/dos.webp",
  "rouge1": "images/rouge1.webp",
  "rouge2": "images/rouge2.webp",
  "rouge3": "images/rouge3.webp",
  "rouge4": "images/rouge4.webp",
  "rouge5": "images/rouge5.webp",
  "bleu1": "images/bleu1.webp",
  "bleu2": "images/bleu2.webp",
  "bleu3": "images/bleu3.webp",
  "bleu4": "images/bleu4.webp",
  "bleu5": "images/bleu5.webp",
  "vert1": "images/vert1.webp",
  "vert2": "images/vert2.webp",
  "vert3": "images/vert3.webp",
  "vert4": "images/vert4.webp",
  "vert5": "images/vert5.webp",
  "jaune1": "images/jaune1.webp",
  "jaune2": "images/jaune2.webp",
  "jaune3": "images/jaune3.webp",
  "jaune4": "images/jaune4.webp",
  "jaune5": "images/jaune5.webp"
};

var COL={
  rouge:{name:'Rouge',title:'Main habituelle',desc:'Tire comme d’habitude.'},
  bleu:{name:'Bleu',title:'Change de main',desc:'Tire avec l’autre main.'},
  vert:{name:'Vert',title:'Un œil fermé',desc:'Ferme un œil pour tirer.'},
  jaune:{name:'Jaune',title:'Tir en cloche',desc:'Envoie la balle en cloche.'}
};
var ORDER=['rouge','bleu','vert','jaune'];
var CLS={rouge:'r',bleu:'b',vert:'g',jaune:'y'};
var VERS={
  1:{t:'Le plus de cartes',d:'Pas de points à compter. Le plus de cartes gagne.'},
  2:{t:'Le plus de points',d:'On additionne les chiffres en haut à droite des cartes.'},
  3:{t:'Points + bonus',d:'Comme les points, et les 5 cartes d’une même couleur valent +10.'}
};
var KEY='bask-shot-cfg';
var cfg={players:['Joueur 1','Joueur 2'],version:1,shots:'free'};
try{
  var sv=JSON.parse(localStorage.getItem(KEY));
  if(sv&&sv.players&&sv.players.length>=2){cfg.players=sv.players.slice(0,8);cfg.version=VERS[sv.version]?sv.version:1;cfg.shots=['free','one','value'].indexOf(sv.shots)>-1?sv.shots:'free'}
}catch(e){}
var screen='setup',G=null,armed=null;
var app=document.getElementById('app');

function esc(s){return String(s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function vib(n){try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function cCol(id){return id.replace(/[0-9]/g,'')}
function cVal(id){return parseInt(id.replace(/[^0-9]/g,''),10)}
function buildDeck(){var d=[];ORDER.forEach(function(c){for(var v=1;v<=5;v++)d.push(c+v)});return shuffle(d)}
function img(id,cls){
  var alt=id==='dos'?'Dos de carte Bask-shot':'Carte '+COL[cCol(id)].name.toLowerCase()+' '+cVal(id)+', '+COL[cCol(id)].title.toLowerCase();
  return '<img class="cimg '+(cls||'')+'" src="'+IMG[id]+'" alt="'+alt+'">';
}
function shotsTxt(n){return n+' shot'+(n>1?'s':'')}
function confetti(){
  var cols=['#ffcf06','#00bf63','#449cac','#d20e16'];
  for(var i=0;i<46;i++){
    var s=document.createElement('span');s.className='cf';
    s.style.left=(Math.random()*100)+'vw';s.style.background=cols[i%4];
    s.style.animationDelay=(Math.random()*1.2)+'s';
    document.body.appendChild(s);
    (function(el){setTimeout(function(){el.remove()},4500)})(s);
  }
}

/* ---------- Réglages ---------- */
function save(){try{localStorage.setItem(KEY,JSON.stringify(cfg))}catch(e){}}
function addPlayer(){if(cfg.players.length<8){cfg.players.push('Joueur '+(cfg.players.length+1));renderSetup()}}
function rmPlayer(i){if(cfg.players.length>2){cfg.players.splice(i,1);renderSetup()}}
function setVersion(v){cfg.version=v;renderSetup()}
function setShots(s){cfg.shots=s;renderSetup()}

function renderSetup(){
  var h='';
  h+='<header class="hero"><div class="fan">'+img('bleu1','f1')+img('jaune1','f2')+img('dos','f3')+'</div><h1>Bask-shot</h1><p>Le jeu de cartes basket de bureau</p></header>';
  h+='<div class="strip"><i style="background:var(--y)"></i><i style="background:var(--g)"></i><i style="background:var(--b)"></i><i style="background:var(--r)"></i></div>';
  h+='<div class="stack">';
  h+='<section class="panel"><h2>Joueurs</h2><div class="stack sm">';
  cfg.players.forEach(function(n,i){
    h+='<div class="prow"><input class="field" value="'+esc(n)+'" maxlength="16" aria-label="Nom du joueur '+(i+1)+'" oninput="cfg.players['+i+']=this.value"><button class="x" aria-label="Retirer le joueur '+(i+1)+'" onclick="rmPlayer('+i+')" '+(cfg.players.length<=2?'disabled':'')+'>×</button></div>';
  });
  h+='</div><div style="margin-top:10px"><button class="ghost" onclick="addPlayer()" '+(cfg.players.length>=8?'disabled':'')+'>Ajouter un joueur</button></div></section>';

  h+='<section class="panel"><h2>Version</h2>';
  [1,2,3].forEach(function(v){
    h+='<button class="opt '+(cfg.version===v?'on':'')+'" onclick="setVersion('+v+')"><b>'+VERS[v].t+'</b><span>'+VERS[v].d+'</span></button>';
  });
  h+='</section>';

  h+='<section class="panel"><h2>Shots pour une carte gagnée</h2><div class="chips">';
  [['free','Libre'],['one','1 shot'],['value','Le chiffre de la carte']].forEach(function(o){
    h+='<button class="chip '+(cfg.shots===o[0]?'on':'')+'" onclick="setShots(\''+o[0]+'\')">'+o[1]+'</button>';
  });
  h+='</div><p class="sub" style="margin-top:10px">Le gagnant les répartit entre les autres joueurs, ou les donne à une seule personne. On peut toujours remplacer un shot par de l’eau.</p></section>';

  h+='<button class="btn" onclick="startGame()">Lancer la partie</button>';
  h+='<details class="rules"><summary>Règles du jeu</summary><ul>'+
    '<li>On mélange les 20 cartes, pile au centre, face cachée.</li>'+
    '<li>On retourne une carte et tout le monde tire comme elle le demande. Le premier qui met un panier gagne la carte.</li>'+
    '<li>Rouge : main habituelle. Bleu : change de main. Vert : un œil fermé. Jaune : tir en cloche.</li>'+
    '<li>Le gagnant donne des shots, répartis entre les autres ou à une seule personne.</li>'+
    '<li>Les 5 cartes d’une même couleur : shot pour tout le monde (et +10 points en version bonus).</li>'+
    '</ul></details>';
  h+='<p class="foot">Réservé aux majeurs. Bois à ton rythme, et on ne prend pas le volant.</p>';
  h+='</div>';
  app.innerHTML=h;
}

/* ---------- Partie ---------- */
function startGame(){
  cfg.players=cfg.players.map(function(n,i){return (String(n).trim()||('Joueur '+(i+1))).slice(0,16)});
  save();
  G={
    players:cfg.players.map(function(n){return {name:n,cards:[],inn:0,out:0}}),
    deck:buildDeck(),current:null,phase:'idle',winner:null,give:{},amount:null,setEvt:null,recap:'',flipKey:0
  };
  screen='game';armed=null;render();window.scrollTo(0,0);
}
function counts(p){var c={};ORDER.forEach(function(k){c[k]=0});p.cards.forEach(function(id){c[cCol(id)]++});return c}
function score(p){
  var pts=0;p.cards.forEach(function(id){pts+=cVal(id)});
  var c=counts(p),bonus=0;
  if(cfg.version===3)ORDER.forEach(function(k){if(c[k]===5)bonus+=10});
  return {cards:p.cards.length,pts:pts,bonus:bonus,total:pts+bonus};
}
function metric(p){var s=score(p);return cfg.version===1?s.cards:(cfg.version===2?s.pts:s.total)}
function unit(){return cfg.version===1?'cartes':'points'}

function flip(){
  G.current=G.deck.shift();G.phase='shoot';G.flipKey++;vib(25);render();
}
function nobody(){
  G.deck.push(G.current);G.current=null;G.phase='idle';G.recap='Personne n’a marqué : la carte repart sous la pile.';render();
}
function win(i){
  G.winner=i;G.players[i].cards.push(G.current);
  G.give={};
  G.amount=cfg.shots==='one'?1:(cfg.shots==='value'?cVal(G.current):null);
  G.phase='shots';vib([30,30,30]);render();
}
function cancelWin(){
  var p=G.players[G.winner];p.cards=p.cards.filter(function(id){return id!==G.current});
  G.winner=null;G.give={};G.phase='shoot';render();
}
function sumGive(){var t=0;Object.keys(G.give).forEach(function(k){t+=G.give[k]});return t}
function giveAdj(i,d){
  var v=(G.give[i]||0)+d;
  if(v<0||v>20)return;
  if(G.amount!==null&&d>0&&sumGive()>=G.amount)return;
  G.give[i]=v;render();
}
function nextCard(){
  G.current=null;G.give={};G.winner=null;G.setEvt=null;
  if(G.deck.length===0){endGame()}else{G.phase='idle';render()}
}
function confirmShots(){
  var w=G.players[G.winner],tot=0,parts=[];
  Object.keys(G.give).forEach(function(k){
    var n=G.give[k];
    if(n>0){G.players[k].inn+=n;tot+=n;parts.push(shotsTxt(n)+' à '+G.players[k].name)}
  });
  w.out+=tot;
  G.recap=w.name+' gagne la carte'+(parts.length?' et donne '+parts.join(', '):'')+'.';
  var col=cCol(G.current);
  var n=w.cards.filter(function(id){return cCol(id)===col}).length;
  if(n===5){
    G.players.forEach(function(p,i){if(i!==G.winner){p.inn+=1;w.out+=1}});
    G.setEvt={color:col,player:G.winner};G.phase='set';vib([60,40,60,40,120]);render();confetti();
  }else{nextCard()}
}
function endGame(){G.phase='end';G.current=null;render();confetti()}
function arm(k){
  if(armed!==k){armed=k;render();setTimeout(function(){if(armed===k){armed=null;if(screen==='game'&&G&&G.phase!=='end')render()}},3000);return}
  armed=null;
  if(k==='end')endGame();else{screen='setup';G=null;render();window.scrollTo(0,0)}
}
function toSetup(){screen='setup';G=null;render();window.scrollTo(0,0)}

/* ---------- Rendu du jeu ---------- */
function boardHTML(){
  var h='<div class="board">';
  G.players.forEach(function(p){
    var c=counts(p);
    h+='<div class="pl"><div class="pn">'+esc(p.name)+'</div><div class="pv">'+metric(p)+'</div><div class="pu">'+unit()+'</div><div class="dots">';
    ORDER.forEach(function(k){
      h+='<b class="'+CLS[k]+(c[k]===0?' z':'')+(c[k]===5?' full':'')+'" title="'+COL[k].name+' : '+c[k]+' sur 5">'+c[k]+'</b>';
    });
    h+='</div></div>';
  });
  return h+'</div>';
}
function renderGame(){
  if(G.phase==='end'){renderEnd();return}
  var h='';
  h+='<div class="top"><h3>Bask-shot</h3><div style="display:flex;gap:8px"><button class="mini" onclick="arm(\'end\')">'+(armed==='end'?'Terminer ?':'Terminer')+'</button><button class="mini" onclick="arm(\'menu\')">'+(armed==='menu'?'Quitter ?':'Menu')+'</button></div></div>';
  h+=boardHTML();
  h+='<div class="stage">';

  if(G.phase==='idle'){
    h+='<div class="pile bob">'+img('dos')+'<span class="badge">'+G.deck.length+' carte'+(G.deck.length>1?'s':'')+'</span></div>';
    h+='<div class="recap">'+esc(G.recap)+'</div>';
    h+='<button class="btn" onclick="flip()">Retourner une carte</button>';
  }

  if(G.phase==='shoot'){
    var c=cCol(G.current),k=COL[c];
    h+='<div class="flip">'+img(G.current,'bigcard')+'</div>';
    h+='<div class="plate '+c+'"><div class="t">'+k.title+'</div><div class="d">'+k.desc+'</div></div>';
    h+='<div class="ask">Tout le monde tire. Qui met le premier panier ?</div>';
    h+='<div class="who">'+G.players.map(function(p,i){return '<button onclick="win('+i+')">'+esc(p.name)+'</button>'}).join('')+'</div>';
    h+='<button class="ghost" onclick="nobody()">Personne, on la remet sous la pile</button>';
  }

  if(G.phase==='shots'){
    var w=G.players[G.winner],cc=cCol(G.current);
    h+=img(G.current,'bigcard');
    h+='<div class="ask">'+esc(w.name)+' gagne la carte '+COL[cc].name.toLowerCase()+' '+cVal(G.current)+'</div>';
    var tot=sumGive();
    h+='<div class="panel" style="width:100%"><h2 style="font-size:20px">Donne des shots</h2>';
    h+='<p class="sub" style="margin-bottom:10px">'+(G.amount!==null?'Tu as '+shotsTxt(G.amount)+' à répartir ('+tot+' sur '+G.amount+').':'Répartis-les entre les autres, ou donne-les à une seule personne.')+'</p>';
    h+='<div class="stack sm">';
    G.players.forEach(function(p,i){
      if(i===G.winner)return;
      h+='<div class="give"><span class="nm">'+esc(p.name)+'</span><button aria-label="Un shot en moins pour '+esc(p.name)+'" onclick="giveAdj('+i+',-1)">−</button><span class="n">'+(G.give[i]||0)+'</span><button aria-label="Un shot en plus pour '+esc(p.name)+'" onclick="giveAdj('+i+',1)">+</button></div>';
    });
    h+='</div></div>';
    var ok=G.amount===null||tot===G.amount;
    h+='<button class="btn dark" onclick="confirmShots()" '+(ok?'':'disabled')+'>Valider</button>';
    h+='<button class="ghost" onclick="cancelWin()">Oups, ce n’est pas la bonne personne</button>';
  }

  if(G.phase==='set'){
    var e=G.setEvt,sp=G.players[e.player];
    h+='<div class="setbox"><h2>Les 5 cartes '+COL[e.color].name.toLowerCase()+'s !</h2><p>'+esc(sp.name)+' a toute l’équipe.</p><p style="margin-top:8px">Shot pour tout le monde !'+(cfg.version===3?' Et +10 points.':'')+'</p></div>';
    h+='<button class="btn dark" onclick="nextCard()">On continue</button>';
  }

  h+='</div>';
  app.innerHTML=h;
}

function renderEnd(){
  var list=G.players.map(function(p,i){return {p:p,i:i,m:metric(p),s:score(p)}}).sort(function(a,b){return b.m-a.m});
  var top=list[0].m,winners=list.filter(function(x){return x.m===top});
  var h='';
  h+='<div class="top"><h3>Bask-shot</h3></div>';
  h+='<div class="stack">';
  h+='<div class="hero" style="padding:0"><h1 style="font-size:40px">Fin de partie</h1><p>'+(winners.length===1?esc(winners[0].p.name)+' gagne !':'Égalité entre '+winners.map(function(x){return esc(x.p.name)}).join(' et ')+' : départagez-vous au tir !')+'</p></div>';
  h+='<div class="stack sm">';
  var rank=0,prev=null;
  list.forEach(function(x,idx){
    if(x.m!==prev){rank=idx+1;prev=x.m}
    var sub=x.s.cards+' carte'+(x.s.cards>1?'s':'')+(cfg.version>1?' · '+x.s.pts+' pts'+(x.s.bonus?' + '+x.s.bonus+' bonus':''):'')+' · shots : '+x.p.out+' donnés, '+x.p.inn+' reçus';
    h+='<div class="rank '+(x.m===top?'win':'')+'"><div class="rk">'+rank+'</div><div class="info"><b>'+esc(x.p.name)+'</b><span>'+sub+'</span></div><div class="sc">'+x.m+'</div></div>';
  });
  h+='</div>';
  var left=G.deck.length;
  if(left>0)h+='<p class="sub" style="text-align:center">Il restait '+left+' carte'+(left>1?'s':'')+' dans la pile.</p>';
  h+='<button class="btn" onclick="startGame()">Rejouer avec les mêmes joueurs</button>';
  h+='<button class="ghost" onclick="toSetup()">Changer les réglages</button>';
  h+='<p class="foot">Un grand verre d’eau pour tout le monde.</p>';
  h+='</div>';
  app.innerHTML=h;
}

function render(){if(screen==='setup')renderSetup();else renderGame()}
render();
</script>
</body>
</html>
